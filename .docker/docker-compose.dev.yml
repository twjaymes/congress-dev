version: '3'
services:
  congress_parser_api:
    container_name: congress_parser_api
    tty: true
    stdin_open: true
    environment:
    - STAGE=${STAGE}
    - PORT=${PORT}
    - db_host=${DB_HOST}
    - db_user=${DB_USER}
    - db_pass=${DB_PASS}
    - db_table=${DB_TABLE}
    build:
      context: ../backend
      dockerfile: .docker/Dockerfile
    volumes:
    - ../backend:/usr/src/app/
    - ../.sources:/usr/src/.sources
    ports:
    - "9000:9000"
    depends_on:
      - congress_postgres
    networks:
      parser:
    entrypoint: "python3"
    command:
    - "-m"
    - "congress_api"
  congress_parser_fastapi:
    container_name: congress_parser_fastapi
    tty: true
    stdin_open: true
    environment:
    - STAGE=${STAGE}
    - PORT=${FASTAPI_PORT}
    - db_host=${DB_HOST}
    - db_user=${DB_USER}
    - db_pass=${DB_PASS}
    - db_table=${DB_TABLE}
    build:
      context: ../backend
      dockerfile: .docker/Dockerfile.fastapi
    volumes:
    - ../backend:/usr/src/app/
    ports:
    - "9001:8080"
    depends_on:
      - congress_postgres
    networks:
      parser:
  congress_viewer_app:
    container_name: congress_viewer_app
    tty: true
    stdin_open: true
    environment:
    - REACT_APP_API_URL=${REACT_APP_API_URL}
    - REACT_APP_API_V2_URL=${REACT_APP_API_V2_URL}
    - STAGE=${STAGE}
    - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING}
    build:
      context: ../frontend
      dockerfile: .docker/Dockerfile
    volumes:
    - ../frontend/public:/usr/src/app/public
    - ../frontend/src:/usr/src/app/src
    - ../frontend/package.json:/usr/src/app/package.json
    - ../frontend/config-overrides.js:/usr/src/app/config-overrides.js
    ports:
    - "3000:3000"
    networks:
      parser:
    command:
    - "start.sh"
  congress_hillstack:
    container_name: congress_hillstack
    tty: true
    stdin_open: true
    build:
      context: ../hillstack
      dockerfile: .docker/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    environment:
    - DATABASE_URL=${DATABASE_URL}
    - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    volumes:
    - ../hillstack/src:/usr/src/app/src
    - ../hillstack/public:/usr/src/app/public
    - ../hillstack/prisma:/usr/src/app/prisma
    - ../hillstack/package.json:/usr/src/app/package.json
    - ../hillstack/next.config.js:/usr/src/app/next.config.js
    - ../hillstack/tsconfig.json:/usr/src/app/tsconfig.json
    ports:
    - "3001:3001"
    depends_on:
      - congress_postgres
    networks:
      parser:
  congress_postgres:
    image: postgres:16
    container_name: congress_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      parser:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: congress_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      # Optional: Disable master password for local dev
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: '${PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED}'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      parser:
      
networks:
  parser:
    driver: bridge
volumes:
  postgres-volume:
  pgadmin_data: