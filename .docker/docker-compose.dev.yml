version: '3'
services:
  congress_parser_api:
    image: congress_parser_api:latest
    container_name: congress_parser_api
    tty: true
    stdin_open: true
    environment:
    - STAGE=dev
    - PORT=9090
    - db_host=congress_postgres:5432
    - db_user=parser
    - db_pass=parser
    - db_table=us_code_2025
    build:
      context: ../backend
      dockerfile: .docker/Dockerfile
    volumes:
    - ../backend:/usr/src/app/
    ports:
    - "9090:9090"
    depends_on:
      - congress_postgres
    networks:
      parser:
    entrypoint: "python3"
    command:
    - "-m"
    - "congress_api"
  congress_parser_fastapi:
    image: congress_parser_fastapi:latest
    container_name: congress_parser_fastapi
    tty: true
    stdin_open: true
    environment:
    - STAGE=dev
    - PORT=9091
    - db_host=congress_postgres:5432
    - db_user=parser
    - db_pass=parser
    - db_table=us_code_2025
    build:
      context: ../backend
      dockerfile: .docker/Dockerfile.fastapi
    volumes:
    - ../backend:/usr/src/app/
    ports:
    - "9091:8080"
    depends_on:
      - congress_postgres
    networks:
      parser:
  congress_viewer_app:
    image: congress_viewer_app:latest
    container_name: congress_viewer_app
    tty: true
    stdin_open: true
    environment:
    - REACT_APP_API_URL=https://api.congress.dev
    - REACT_APP_API_V2_URL=https://api-v2.congress.dev
    - STAGE=dev
    - CHOKIDAR_USEPOLLING=true
    #- REACT_APP_API_URL=http://localhost:9090
    build:
      context: ../frontend
      dockerfile: .docker/Dockerfile
    volumes:
    - ../frontend/public:/usr/src/app/public
    - ../frontend/src:/usr/src/app/src
    - ../frontend/package.json:/usr/src/app/package.json
    - ../frontend/config-overrides.js:/usr/src/app/config-overrides.js
    ports:
    - "3000:3000"
    networks:
      parser:
    command:
    - "start.sh"
  congress_hillstack:
    image: congress_hillstack:latest
    container_name: congress_hillstack
    tty: true
    stdin_open: true
    build:
      context: ../hillstack
      dockerfile: .docker/Dockerfile
      args:
        DATABASE_URL: postgresql://parser:parser@congress_postgres:5432/us_code_2025
        NEXT_PUBLIC_APP_URL: http://localhost:3001
    environment:
    - DATABASE_URL=postgresql://parser:parser@congress_postgres:5432/us_code_2025
    - NEXT_PUBLIC_APP_URL=http://localhost:3001
    ports:
    - "3001:3001"
    depends_on:
      - congress_postgres
    networks:
      parser:
  congress_postgres:
    image: postgres:16
    container_name: congress_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: parser
      POSTGRES_USER: parser
      POSTGRES_DB: us_code_2025
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      parser:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: congress_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: user@example.com
      PGADMIN_DEFAULT_PASSWORD: your_admin_password
      # Optional: Disable master password for local dev
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      parser:
networks:
  parser:
    driver: bridge
volumes:
  postgres-volume:
  pgadmin_data: